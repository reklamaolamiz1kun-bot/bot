services:
  - type: web
    name: summon-media-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_FILE_MB
        value: "45"
      - key: WORKDIR
        value: /tmp/summon_media
